<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
</head>
<body>
    <fieldset>
        <h1>Register</h1>
        <fieldset>
            <legend>Person Detail</legend>
            <form name="myForm" action="processData.php" method="POST">
                <div class="field">
                    <label for="surename">Surename</label>
                    <input type="text" name="surename" size="31"/>
                </div>
                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="text" name="email" size="31"/>
                </div>
                <div class="field">
                    <label for="passwd">Password</label>
                    <input type="password" name="passwd" size="31"/>
                </div>
                <div class="field">
                    <label for="address">Street Address</label>
                    <textarea name="address" rows="3" cols="22"></textarea>
                </div>
                <div class="field">
                    <label for="state">State</label>
                    <select name="state">
                        <option value="-1" selected>[choose your state]</option>
                        <option value="1">Australian Capital Teritory</option>
                        <option value="2">Queensland</option>
                        <option value="3">Victoria</option>
                        <option value="4">New South Wales</option>
                        <option value="5">Tasmania</option>
                        <option value="6">South Australia</option>
                        <option value="7">Western Australia</option>
                        <option value="8">Northern Teritory</option>
                    </select>
                </div>
                <div class="field">
                    <input type="hidden" name="country" value="Australia">
                </div>
                <div class="field">
                    <label for="sex">Gender</label>
                    <input type="radio" name="sex" value="male"/>Male
                    <input type="radio" name="sex" value="female"/>Female
                </div>
                <div class="field">
                    <label for="vegetarian">Vegetarian?</label>
                    <input type="checkbox" name="vegetarian"/>
                </div>
                <div class="field">
                    <label>&nbsp;</label>
                    <input type="submit" value="Submit" name="submit"/>
                    <input type="reset" value="Reset" name="reset">
                </div>
            </form>
        </fieldset>
    </fieldset>
</body>
</html>
